<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dombalak – Digital Mizah & Eğlence Dergisi</title>

<meta name="description" content="Dombalak Digital Mizah & Eğlence Dergisi">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101010;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  padding:34px 16px;
  text-align:center;
  background:linear-gradient(135deg,#111,#2a1800);
}

.logo{
  font-size:clamp(42px,10vw,90px);
  font-weight:900;
  color:#ffb000;
  text-shadow:4px 4px #000,-2px -2px #000;
}

.tag{
  font-size:18px;
  font-weight:bold;
  margin-top:8px;
}

.hero{
  max-width:1100px;
  margin:auto;
  padding:25px 16px;
  text-align:center;
}

h1{
  font-size:clamp(30px,6vw,60px);
  margin:10px 0;
  color:#ffb000;
}

h2{
  margin-top:36px;
}

.buttons{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin:22px 0;
}

.btn{
  display:inline-block;
  padding:14px 22px;
  border-radius:14px;
  text-decoration:none;
  font-weight:900;
  background:#fff;
  color:#111;
}

.btn.dark{
  background:#ffb000;
  color:#111;
}

.reader{
  max-width:1100px;
  margin:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.note{
  color:#ddd;
  line-height:1.5;
}

.page{
  width:100%;
  max-width:900px;
  display:block;
  margin:18px auto;
  border-radius:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}

footer{
  text-align:center;
  padding:30px 15px;
  background:#070707;
  color:#aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">DOMBALAK</div>
  <div class="tag">Ciddiyet yasak,Kahkaha serbest 😎</div>

  </p>
